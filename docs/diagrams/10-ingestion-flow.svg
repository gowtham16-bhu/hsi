<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Data ingestion flow</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Each domain brings its own sources and parsing (blue). The core path (amber) is identical for every domain.</text><text x="40.0" y="118.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">DOMAIN-OWNED · PLUGINS</text><rect x="40.0" y="130.0" width="208.3" height="78.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Domain sources</text><text x="52.0" y="176.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">tools, files, databases,</text><text x="52.0" y="193.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">chat, streams</text><rect x="282.3" y="130.0" width="208.3" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="294.3" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Connectors</text><text x="294.3" y="176.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">YAML, standard formats, or</text><text x="294.3" y="193.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Python SDK</text><path d="M 250.3 169.0 L 278.3 169.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="524.7" y="130.0" width="208.3" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="536.7" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Parsers</text><text x="536.7" y="176.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">PDF, HTML, DOCX, email,</text><text x="536.7" y="193.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">exports</text><path d="M 492.7 169.0 L 520.7 169.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="767.0" y="130.0" width="208.3" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="779.0" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Entity patterns</text><text x="779.0" y="176.0" font-family="'Segoe UI', Helvetica, Arial, sans-ser