ct x="40.0" y="252.0" width="1320.0" height="82.0" rx="6" fill="#FFFFFF" stroke="#C98A12" stroke-width="1.6"/><rect x="40.0" y="252.0" width="5.0" height="82.0" rx="2" fill="#C98A12" stroke="#C98A12" stroke-width="1.6"/><text x="58.0" y="278.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">pairs before : k(k − 1) / 2</text><text x="58.0" y="298.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">pairs after  : Σ_f k_f(k_f − 1) / 2     with Σ_f k_f = k</text><text x="58.0" y="318.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">example      : k = 10,000 → ~5·10⁷ pairs;  20 facets of 500 → ~2.5·10⁶ pairs</text><rect x="40.0" y="362.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="362.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="194.8" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="337.6" y="362.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="361.6" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</