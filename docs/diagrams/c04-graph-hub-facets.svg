<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="444" viewBox="0 0 1400 444"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">C4 · Graph and hub facets</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Builds the typed graph and splits hub entities by relation so chains through them stay meaningful.</text><rect x="40.0" y="100.0" width="191.7" height="112.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Passages, entities,</text><text x="52.0" y="144.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">facts</text><text x="52.0" y="164.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">from C2, C3, connectors</text><rect x="265.7" y="100.0" width="191.7" height="112.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="277.7" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Typed edges</text><text x="277.7" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">mention, anchor</text><text x="277.7" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">structured fact</text><text x="277.7" y="180.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">reference, thread,</text><text x="277.7" y="197.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">section</text><path d="M 233.7 156.0 L 261.7 156.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="491.3" y="100.0" width="191.7" height="112.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="503.3" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Hub check</text><text x="503.3" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">in-degree &gt; D_max</text><path d="M 459.3 156.0 L 487.3 156.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="100.0" width="191.7" height="112.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="729.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Relation contexts</text><text x="729.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="1