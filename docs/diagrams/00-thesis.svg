<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">HSI thesis</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">The core engine is the thesis. Supporting modules make it robust. Additions apply it. Each layer depends only on the one below.</text><rect x="40.0" y="100.0" width="1420.0" height="70.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="52.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Additions · applications, not thesis claims</text><text x="52.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Connectors for any source (A2) · permissions and security (A3) · multimodal ingestion (A4) · copilot (A1) · incremental updates (C10) · domain packs</text><rect x="40.0" y="200.0" width="1420.0" height="70.0" rx="10" fill="#EEF0F3" stroke="#6B7684" stroke-width="1.6"/><text x="52.0" y="226.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve" style="white-space:pre">Supporting · robustness on real data</text><text x="52.0" y="246.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">C2 ingestion without titles · C3 entity resolution with soft aliases · C4 relation-faceted hubs · C9 graph-checked reading (RQ5)</text><rect x="40.0" y="300.0" width="1420.0" height="130.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="52.0" y="326.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Thesis core · HSI</text><text x="52.0" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Hierarchy: 2-, 3- and 4-passage chain entries in one flat index, unpacked into ordered evidence (C5, C7)</text><text x="52.0" y="363.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Composer: one key per chain from frozen passage vectors, trained with Chain-ICT, no LLM (C5)</text><text x="52.0" y="380.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Budgeted selection: |S| ≤ βN, facility location, (1 − 1/e) per level (C6)</text><text x="52.0" y="397.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Single lookup: one nearest-neighbour search over I = P ∪ S (C7)</text><path d="M 750.0 172.0 L 750.0 196.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 750.0 272.0 L 750.0 296.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="460.0" width="1420.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#C98A12" stroke-width="1.6"/><rect x="40.0" y="460.0" width="5.0" height="62.0" rx="2" fill="#C98A12" stroke="#C98A12" stroke-width="1.6"/><text x="58.0" y="486.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">maximize   E_q [ 1( c* ⊆ R_k(q) ) ]            R_k(q) = first k passages of unpack( topK over I = P ∪ S )</text><text x="58.0" y="506.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">subject to |S| ≤ βN · zero LLM calls while building the index · one nearest-neighbour search per question</text><text x="40.0" y="566.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">RESEARCH QUESTIONS → GATES</text><rect x="40.0" y="578.0" width="256.8" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="52.0" y="604.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">RQ1 Depth</text><text x="52.0" y="624.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">single-lookup chains beat online</text><text x="52.0" y="641.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">expansion at 3–4 hops</text><text x="52.0" y="658.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Gate 0</text><text x="286.8" y="596.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#C98A12" text-anchor="end" xml:space="preserve" style="white-space:pre">kill rule</text><rect x="330.8" y="578.0" width="256.8" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="342.8" y="604.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">RQ2 Keys</text><text x="342.8" y="624.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">composed keys ≈ text keys,</text><text x="342.8" y="641.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">transfer across corpora</text><text x="342.8" y="658.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Gate 1–2</text><path d="M 298.8 625.5 L 326.8 625.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="621.6" y="578.0" width="256.8" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="633.6" y="604.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">RQ3 Budget</text><text x="633.6" y="624.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">greedy coverage beats heuristics</text><text x="633.6" y="641.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">at every β</text><text x="633.6" y="658.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Gate 1</text><path d="M 589.6 625.5 L 617.6 625.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="912.4" y="578.0" width="256.8" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="924.4" y="604.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">RQ4 Cost</text><text x="924.4" y="624.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Pareto-better than LLM-indexed</text><text x="924.4" y="641.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">and iterative methods</text><text x="924.4" y="658.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Gate 1</text><path d="M 880.4 625.5 L 908.4 625.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1203.2" y="578.0" width="256.8" height="95.0" rx="10" fill="#EEF0F3" stroke="#6B7684" stroke-width="1.6"/><text x="1215.2" y="604.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve" style="white-space:pre">RQ5 Trust</text><text x="1215.2" y="624.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">graph-checked reading lowers</text><text x="1215.2" y="641.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">error at equal coverage</text><text x="1215.2" y="658.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Gate 2</text><path d="M 1171.2 625.5 L 1199.2 625.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="718.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="64.0" y="731.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="206.8" y="718.0" width="16.0" height="16.0" rx="3" fill="#EEF0F3" stroke="#6B7684" stroke-width="1.6"/><text x="230.8" y="731.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">storage / middleware</text><rect x="380.8" y="718.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="404.8" y="731.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text></svg>