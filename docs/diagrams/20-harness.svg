<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Evaluation harness</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Every system gets the same data, the same reader and the same passage budget. Results decide the gates.</text><rect x="40.0" y="110.0" width="329.5" height="95.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Datasets</text><text x="52.0" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">MuSiQue, 2Wiki, HotpotQA</text><text x="52.0" y="173.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">OSV security harness</text><text x="52.0" y="190.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">200 human-checked questions</text><rect x="403.5" y="110.0" width="329.5" height="95.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="415.5" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Loaders</text><text x="415.5" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">canonical documents</text><text x="415.5" y="173.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">gold chains per hop</text><path d="M 371.5 157.5 L 399.5 157.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="767.0" y="110.0" width="329.5" height="95.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="779.0" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Question generator</text><text x="779.0" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">2–4 hop questions from structured facts</text><path d="M 735.0 157.5 L 763.0 157.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1130.5" y="110.0" width="329.5" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="1142.5" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Systems under test</text><text x="1142.5" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">HSI FAST / QUALITY / MAX</text><text x="1142.5" y="173.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">dense, BM25, online expansion</text><text x="1142.5" y="190.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">HippoRAG 2, IndexRAG, AAR, IRCoT</text><path d="M 1098.5 157.5 L 1126.5 157.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="340.0" width="256.8" height="112.0" rx="10" fill="#EEF0F3" stroke="#6B7684" stroke-width="1.6"/><text x="52.0" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve" style="white-space:pre">Fixed conditions</text><text x="52.0" y="386.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">same reader model</text><text x="52.0" y="403.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">same passage budget</text><text x="52.0" y="420.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">3 seeds</text><rect x="330.8" y="340.0" width="256.8" height="112.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="342.8" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Evaluator</text><text x="342.8" y="386.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">waterfall per hop</text><text x="342.8" y="403.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">full-chain recall@k</text><text x="342.8" y="420.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">F1, risk–coverage</text><text x="342.8" y="437.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">cost, freshness</text><path d="M 298.8 396.0 L 326.8 396.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="621.6" y="340.0" width="256.8" height="112.0" rx="10" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="633.6" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7A2C25" text-anchor="start" xml:space="preserve" style="white-space:pre">Security suites</text><text x="633.6" y="386.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">permissions, injection, secrets,</text><text x="633.6" y="403.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">poisoning</text><path d="M 589.6 396.0 L 617.6 396.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="912.4" y="340.0" width="256.8" height="112.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="924.4" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Reports</text><text x="924.4" y="386.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">tables, plots, confidence</text><text x="924.4" y="403.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">intervals, hashes</text><path d="M 880.4 396.0 L 908.4 396.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1203.2" y="340.0" width="256.8" height="112.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="1215.2" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Gate decision</text><text x="1215.2" y="386.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">pass, narrow or stop</text><text x="1215.2" y="403.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">written to specs/decisions</text><path d="M 1171.2 396.0 L 1199.2 396.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1295.2 207.0 L 1295.2 272.5 L 168.4 272.5 L 168.4 336.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="540.0" width="1420.0" height="74.0" rx="10" fill="#EEF0F3" stroke="#6B7684" stroke-width="1.6"/><text x="52.0" y="566.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve" style="white-space:pre">Continuous integration</text><text x="52.0" y="586.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Every core change runs a fixed 200-question slice. A drop of more than 1 point on any per-hop recall, or any new security failure, fails the build.</text><rect x="40.0" y="658.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="671.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="658.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="194.8" y="671.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text><rect x="431.2" y="658.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="455.2" y="671.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="598.0" y="658.0" width="16.0" height="16.0" rx="3" fill="#EEF0F3" stroke="#6B7684" stroke-width="1.6"/><text x="622.0" y="671.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">storage / middleware</text><rect x="772.0" y="658.0" width="16.0" height="16.0" rx="3" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="796.0" y="671.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">fallback / partial</text><rect x="931.6" y="658.0" width="16.0" height="16.0" rx="3" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="955.6" y="671.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output / user</text></svg>