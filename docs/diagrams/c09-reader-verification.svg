<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="565" viewBox="0 0 1400 565"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">C9 · Reader contract and verification</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">One LLM call returns structured reasoning; the graph checks it before anything reaches the user.</text><rect x="40.0" y="100.0" width="304.5" height="95.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Top chains</text><text x="52.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">from C7</text><rect x="378.5" y="100.0" width="304.5" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="390.5" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Assemble</text><text x="390.5" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">hop order</text><text x="390.5" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">comparison slots</text><text x="390.5" y="180.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">passages quoted as data</text><path d="M 346.5 147.5 L 374.5 147.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="100.0" width="304.5" height="95.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="729.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Reader plugin</text><text x="729.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">1 LLM call</text><text x="729.0" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">JSON per chain</text><path d="M 685.0 147.5 L 713.0 147.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1055.5" y="100.0" width="304.5" height="95.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="1067.5" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Checks</text><text x="1067.5" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">bridges vs graph</text><text x="1067.5" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">quote in passage</text><text x="1067.5" y="180.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">answer type, NLI</text><path d="M 1023.5 147.5 L 1051.5 147.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="255.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="52.0" y="281.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Chain vote</text><text x="52.0" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">weighted by chain score and bridge check</text><rect x="378.5" y="255.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="390.5" y="281.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Confidence</text><text x="390.5" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">isotonic calibration</text><path d="M 346.5 294.0 L 374.5 294.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="255.0" width="304.5" height="78.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="729.0" y="281.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">conf ≥ τ: answer</text><text x="729.0" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">with evidence chain</text><path d="M 685.0 294.0 L 713.0 294.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1055.5" y="255.0" width="304.5" height="78.0" rx="10" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="1067.5" y="281.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7A2C25" text-anchor="start" xml:space="preserve" style="white-space:pre">conf &lt; τ: partial</text><text x="1067.5" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">verified hops only</text><text x="1067.5" y="318.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">MAX: one retry</text><path d="M 1023.5 294.0 L 1051.5 294.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1207.8 197.0 L 1207.8 225.0 L 192.2 225.0 L 192.2 251.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="373.0" width="1320.0" height="82.0" rx="6" fill="#FFFFFF" stroke="#C98A12" stroke-width="1.6"/><rect x="40.0" y="373.0" width="5.0" height="82.0" rx="2" fill="#C98A12" stroke="#C98A12" stroke-width="1.6"/><text x="58.0" y="399.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">B(c,y) = mean_t 1[ y.bridge_t ∈ aliases(e_t) ]       Q = quote ⊂ p_ℓ and answer ⊂ quote</text><text x="58.0" y="419.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">V(a)   = Σ_c R(q,c)·1[y_c = a]·B(c,y) / Σ_c R(q,c)</text><text x="58.0" y="439.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">conf   = isotonic( σ(θ·[log P, E, B, T, Q, V]) )      τ: error among answered ≤ 5%</text><rect x="40.0" y="483.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="496.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="483.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="194.8" y="496.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="337.6" y="483.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="361.6" y="496.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text><rect x="598.0" y="483.0" width="16.0" height="16.0" rx="3" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="622.0" y="496.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output / user</text><rect x="721.6" y="483.0" width="16.0" height="16.0" rx="3" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="745.6" y="496.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">fallback / partial</text></svg>