<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="548" viewBox="0 0 1400 548"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">C7 · Index and retrieval</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">One vector index holds passages and shortcuts. Retrieval returns whole ordered chains.</text><rect x="40.0" y="100.0" width="191.7" height="78.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Question</text><text x="52.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">from a surface</text><rect x="265.7" y="100.0" width="191.7" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="277.7" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Encode</text><text x="277.7" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">encoder plugin</text><path d="M 233.7 139.0 L 261.7 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="491.3" y="100.0" width="191.7" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="503.3" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Dense + BM25</text><text x="503.3" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">vector store plugin</text><text x="503.3" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">keyword index</text><path d="M 459.3 139.0 L 487.3 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="100.0" width="191.7" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="729.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Fusion</text><text x="729.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">reciprocal rank fusion</text><path d="M 685.0 139.0 L 713.0 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="942.7" y="100.0" width="191.7" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="954.7" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Unpack</text><text x="954.7" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">shortcut → ordered</text><text x="954.7" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">passages</text><path d="M 910.7 139.0 L 938.7 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1168.3" y="100.0" width="191.7" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="1180.3" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">C8 filter</text><text x="1180.3" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">before anything else</text><path d="M 1136.3 139.0 L 1164.3 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="52.0" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Completion</text><text x="52.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">composer-scored beam</text><text x="52.0" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">up to 4 passages</text><rect x="378.5" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="390.5" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Chain score S</text><text x="390.5" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">key, start, answer sentence,</text><text x="390.5" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">probability, length</text><path d="M 346.5 277.0 L 374.5 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="238.0" width="304.5" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="729.0" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Cross-encoder</text><text x="729.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">reranker plugin, top 50</text><path d="M 685.0 277.0 L 713.0 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1055.5" y="238.0" width="304.5" height="78.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="1067.5" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Top chains</text><text x="1067.5" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">to C9</text><path d="M 1023.5 277.0 L 1051.5 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1264.2 180.0 L 1264.2 208.0 L 192.2 208.0 L 192.2 234.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="356.0" width="1320.0" height="82.0" rx="6" fill="#FFFFFF" stroke="#C98A12" stroke-width="1.6"/><rect x="40.0" y="356.0" width="5.0" height="82.0" rx="2" fill="#C98A12" stroke="#C98A12" stroke-width="1.6"/><text x="58.0" y="382.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">S(q,c) = w₁·cos(q,k_c) + w₂·cos(q,v_p₁) + w₃·max_s cos(q,v_s) + w₄·log P(c) − w₅·(ℓ − 1)</text><text x="58.0" y="402.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">R(q,c) = S(q,c) + w₆·CE(q, text(c))</text><text x="58.0" y="422.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">modes  : FAST = S only · QUALITY = all steps · MAX = QUALITY + one retry in C9</text><rect x="40.0" y="466.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="466.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="194.8" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="337.6" y="466.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="361.6" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text><rect x="598.0" y="466.0" width="16.0" height="16.0" rx="3" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="622.0" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output / user</text><rect x="721.6" y="466.0" width="16.0" height="16.0" rx="3" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="745.6" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">fallback / partial</text></svg>