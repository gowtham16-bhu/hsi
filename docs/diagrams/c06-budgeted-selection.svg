<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="528" viewBox="0 0 1400 528"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">C6 · Budgeted selection</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Chooses which chains become stored shortcuts, and lets the index learn from verified use.</text><rect x="40.0" y="100.0" width="236.8" height="78.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Chains + keys</text><text x="52.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">from C5</text><rect x="310.8" y="100.0" width="236.8" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="322.8" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Usefulness u(c)</text><text x="322.8" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">corpus-independent features</text><path d="M 278.8 139.0 L 306.8 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="581.6" y="100.0" width="236.8" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="593.6" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Facility location</text><text x="593.6" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">cover useful chains, avoid</text><text x="593.6" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">near-duplicates</text><path d="M 549.6 139.0 L 577.6 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="852.4" y="100.0" width="236.8" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="864.4" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Lazy greedy</text><text x="864.4" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">per level</text><text x="864.4" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">50 / 30 / 20 split</text><path d="M 820.4 139.0 L 848.4 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1123.2" y="100.0" width="236.8" height="78.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="1135.2" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Stored shortcuts</text><text x="1135.2" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">≤ βN</text><path d="M 1091.2 139.0 L 1119.2 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="238.0" width="304.5" height="78.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Completed chain</text><text x="52.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">built at query time by C7</text><rect x="378.5" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="390.5" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Benefit</text><text x="390.5" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">verified uses × time saved</text><path d="M 346.5 277.0 L 374.5 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="729.0" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Promotion</text><text x="729.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">replace the lowest-benefit shortcut of</text><text x="729.0" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">its level</text><path d="M 685.0 277.0 L 713.0 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1055.5" y="238.0" width="304.5" height="78.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="1067.5" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Budget holds</text><text x="1067.5" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">|S| ≤ βN always</text><path d="M 1023.5 277.0 L 1051.5 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1241.6 180.0 L 1241.6 208.0 L 192.2 208.0 L 192.2 234.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="356.0" width="1320.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#C98A12" stroke-width="1.6"/><rect x="40.0" y="356.0" width="5.0" height="62.0" rx="2" fill="#C98A12" stroke="#C98A12" stroke-width="1.6"/><text x="58.0" y="382.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">F(S)  = Σ_c u(c) · max_{s ∈ S} Jaccard(passages(c), passages(s))</text><text x="58.0" y="402.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">greedy ≥ (1 − 1/e) · OPT  per level, with uniform cost per shortcut</text><rect x="40.0" y="446.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="459.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="446.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="194.8" y="459.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="337.6" y="446.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="361.6" y="459.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text><rect x="598.0" y="446.0" width="16.0" height="16.0" rx="3" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="622.0" y="459.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output / user</text><rect x="721.6" y="446.0" width="16.0" height="16.0" rx="3" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="745.6" y="459.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">fallback / partial</text></svg>