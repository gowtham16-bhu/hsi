 stroke="#C98A12" stroke-width="1.6"/><text x="322.8" y="247.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">visible(p, u)</text><text x="322.8" y="267.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">per passage</text><path d="M 278.8 251.5 L 306.8 251.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="581.6" y="221.0" width="236.8" height="61.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="593.6" y="247.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">visible(c, u)</text><text x="593.6" y="267.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">every passage visible</text><path d="M 549.6 251.5 L 577.6 251.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="852.4" y="221.0" width="236.8" height="61.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="864.4" y="247.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Policy</text><text x="864.4" y="267.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">hide (default) or redacted</text><path d="M 820.4 251.5 L 848.4 251.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1123.2" y="221.0" width="236.8" height="61.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="1135.2" y="247.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Strict mode</text><text x="1135.2" y="267.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">ACL-homogeneous shortcuts</text><path d="M 1091.2 251.5 L 1119.2 251.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1207.8 163.0 L 1207.8 191.0 L 158.4 191.0 L 158.4 217.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="322.0" width="1320.0" height="82.0" rx="6" fill="#FFFFFF" stroke="#C98A12" stroke-width="1.6"/><rect x="40.0" y="322.0" width="5.0" height="82.0" rx="2" fill="#C98A12" stroke="#C98A12" stroke-width="1.6"/><text x="58.0" y="348.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">visible(p,u) ⇔ public(p) ∨ principals(p) ∩ principals(u) ≠ ∅</text><text x="58.0" y="368.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">visible(c,u) ⇔ ∀ p ∈ c : visible(p,u)</text><text x="58.0" y="388.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">completion expands only into visible passages</text><rect x="40.0" y="432.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="445.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="432.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="194.8" y="445.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="337.6" y="432.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="361.6" y="445.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text><rect x="598.0" y="432.0" width="16.0" height="16.0" rx="3" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="622.0" y="445.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output / user</text><rect x="721.6" y="432.0" width="16.0" height="16.0" rx="3" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="745.6" y="445.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">fallback / partial</text></svg>