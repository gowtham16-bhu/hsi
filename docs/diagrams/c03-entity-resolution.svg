<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="548" viewBox="0 0 1400 548"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">C3 · Entity resolution</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Aliases (merge) and same names (split) are one problem, solved with one objective.</text><rect x="40.0" y="100.0" width="304.5" height="78.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Mentions + facts</text><text x="52.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">from C2 and connectors</text><rect x="378.5" y="100.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="390.5" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Hard joins</text><text x="390.5" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">same EntityRef</text><text x="390.5" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">alias_of ≥ 0.95</text><path d="M 346.5 139.0 L 374.5 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="100.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="729.0" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Blocking</text><text x="729.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">shared token, initials, acronym, ref</text><text x="729.0" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">prefix</text><path d="M 685.0 139.0 L 713.0 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1055.5" y="100.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="1067.5" y="126.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Pair probability</text><text x="1067.5" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">string, acronym, alias pattern, context,</text><text x="1067.5" y="163.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">neighbors, coref, type, trust</text><path d="M 1023.5 139.0 L 1051.5 139.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="52.0" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Correlation clustering</text><text x="52.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">randomized pivot</text><text x="52.0" y="301.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">best of R runs</text><rect x="378.5" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="390.5" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Soft aliases</text><text x="390.5" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">uncertain pairs kept as weighted edges</text><path d="M 346.5 277.0 L 374.5 277.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="717.0" y="238.0" width="304.5" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="729.0" y="264.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">Feedback</text><text x="729.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" 