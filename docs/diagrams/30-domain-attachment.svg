<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Attaching HSI to any domain</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">A domain pack brings its own ingestion and its own retrieval and augmentation. The core engine is the same for all of them.</text><rect x="560.0" y="330.0" width="380.0" height="230.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="572.0" y="356.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">HSI core engine</text><text x="572.0" y="376.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">C1–C10, unchanged</text><text x="572.0" y="393.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><text x="572.0" y="410.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">ingest API</text><text x="572.0" y="427.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">query API</text><text x="572.0" y="444.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">update API</text><text x="572.0" y="461.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><text x="572.0" y="478.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">PostgreSQL + vector store</text><rect x="40.0" y="120.0" width="380.0" height="112.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="52.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Software supply-chain security</text><text x="52.0" y="166.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Ingest: SCA and SAST exports, SBOMs, advisories,</text><text x="52.0" y="183.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">ALM items</text><text x="52.0" y="200.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Augment: exposure questions, owners, risk</text><text x="52.0" y="217.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">decisions, Watch on new CVEs</text><path d="M 422.0 176.0 L 556.0 405.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="560.0" width="380.0" height="112.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="52.0" y="586.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">IT operations and incidents</text><text x="52.0" y="606.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Ingest: tickets, runbooks, postmortems, CMDB, chat</text><text x="52.0" y="623.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">threads</text><text x="52.0" y="640.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Augment: incident chains, ownership, the fix used</text><text x="52.0" y="657.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">last time</text><path d="M 422.0 616.0 L 556.0 485.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1080.0" y="120.0" width="380.0" height="112.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="1092.0" y="146.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Legal and compliance</text><text x="1092.0" y="166.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Ingest: contracts, policies, registries, audit</text><text x="1092.0" y="183.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">evidence</text><text x="1092.0" y="200.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Augment: obligation chains, defined terms,</text><text x="1092.0" y="217.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">evidence for controls</text><path d="M 1078.0 176.0 L 944.0 405.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1080.0" y="560.0" width="380.0" height="95.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="1092.0" y="586.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Customer support</text><text x="1092.0" y="606.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Ingest: tickets, product docs, release notes,</text><text x="1092.0" y="623.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">known issues</text><text x="1092.0" y="640.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Augment: root-cause chains, known-fix answers</text><path d="M 1078.0 607.5 L 944.0 485.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="560.0" y="680.0" width="380.0" height="95.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="572.0" y="706.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Your next domain</text><text x="572.0" y="726.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Ingest: write connectors (YAML, formats, SDK)</text><text x="572.0" y="743.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Augment: prompt template, answer format, Watch</text><text x="572.0" y="760.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">rules</text><path d="M 750.0 678.0 L 750.0 564.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="858.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="64.0" y="871.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="206.8" y="858.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="230.8" y="871.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text></svg>