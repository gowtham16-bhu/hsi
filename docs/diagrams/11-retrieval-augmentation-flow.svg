<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8796"/></marker></defs><rect width="100%" height="100%" fill="#F8F9FB"/><text x="30.0" y="42.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">Retrieval and augmentation flow</text><text x="30.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">Domains own how questions come in and how answers look (blue). The core owns retrieval, permissions and verification (amber).</text><rect x="40.0" y="110.0" width="208.3" height="78.0" rx="10" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="52.0" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start" xml:space="preserve" style="white-space:pre">User question</text><text x="52.0" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">any surface</text><rect x="282.3" y="110.0" width="208.3" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="294.3" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Surface plugin</text><text x="294.3" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">web, Slack / Teams, REST,</text><text x="294.3" y="173.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">IDE</text><path d="M 250.3 149.0 L 278.3 149.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="524.7" y="110.0" width="208.3" height="78.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="536.7" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Identity plugin</text><text x="536.7" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">principals(u) from SSO</text><path d="M 492.7 149.0 L 520.7 149.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="767.0" y="110.0" width="208.3" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="779.0" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">C7 Retrieve</text><text x="779.0" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">dense + BM25, unpack</text><text x="779.0" y="173.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">chains</text><path d="M 735.0 149.0 L 763.0 149.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1009.3" y="110.0" width="208.3" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="1021.3" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">C8 Permissions</text><text x="1021.3" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">hide what u cannot see</text><path d="M 977.3 149.0 L 1005.3 149.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1251.7" y="110.0" width="208.3" height="78.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="1263.7" y="136.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">C7 Complete + rerank</text><text x="1263.7" y="156.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">beam, chain score, cross-</text><text x="1263.7" y="173.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">encoder</text><path d="M 1219.7 149.0 L 1247.7 149.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="320.0" width="208.3" height="79.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="52.0" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">C9 Assemble</text><text x="52.0" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">hop-ordered chains, quoted</text><text x="52.0" y="383.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">as data</text><rect x="282.3" y="320.0" width="208.3" height="79.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="294.3" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Domain prompt template</text><text x="294.3" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">question types, wording,</text><text x="294.3" y="383.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output fields</text><path d="M 250.3 359.5 L 278.3 359.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="524.7" y="320.0" width="208.3" height="79.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="536.7" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Reader LLM plugin</text><text x="536.7" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">1 call, JSON per chain</text><path d="M 492.7 359.5 L 520.7 359.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="767.0" y="320.0" width="208.3" height="79.0" rx="10" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="779.0" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6E4A05" text-anchor="start" xml:space="preserve" style="white-space:pre">C9 Verify</text><text x="779.0" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">bridges, quote, type, NLI,</text><text x="779.0" y="383.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">vote, confidence</text><path d="M 735.0 359.5 L 763.0 359.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1009.3" y="320.0" width="208.3" height="79.0" rx="10" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="1021.3" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">Domain answer</text><text x="1021.3" y="364.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E4470" text-anchor="start" xml:space="preserve" style="white-space:pre">formatter</text><text x="1021.3" y="384.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">links back to source tools</text><path d="M 977.3 359.5 L 1005.3 359.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1251.7" y="320.0" width="208.3" height="79.0" rx="10" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="1263.7" y="346.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1D553B" text-anchor="start" xml:space="preserve" style="white-space:pre">Answer or partial</text><text x="1263.7" y="366.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">evidence chain +</text><text x="1263.7" y="383.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">confidence</text><path d="M 1219.7 359.5 L 1247.7 359.5" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1355.8 190.0 L 1355.8 254.0 L 144.2 254.0 L 144.2 316.0" fill="none" stroke="#7D8796" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.0" y="470.0" width="1420.0" height="74.0" rx="10" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="52.0" y="496.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7A2C25" text-anchor="start" xml:space="preserve" style="white-space:pre">The augmentation is checked, not trusted</text><text x="52.0" y="516.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">The reader&#x27;s bridges are compared with the graph; weak answers become verified partial results. Write actions need user confirmation.</text><rect x="40.0" y="598.0" width="16.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#9AA4B1" stroke-width="1.6"/><text x="64.0" y="611.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">input / source</text><rect x="170.8" y="598.0" width="16.0" height="16.0" rx="3" fill="#E4EDF7" stroke="#2C5C8F" stroke-width="1.6"/><text x="194.8" y="611.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">plugin (swappable, domain-owned)</text><rect x="431.2" y="598.0" width="16.0" height="16.0" rx="3" fill="#FBF0D9" stroke="#C98A12" stroke-width="1.6"/><text x="455.2" y="611.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">core engine (fixed)</text><rect x="598.0" y="598.0" width="16.0" height="16.0" rx="3" fill="#E2F2EA" stroke="#2D7A55" stroke-width="1.6"/><text x="622.0" y="611.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">output / user</text><rect x="721.6" y="598.0" width="16.0" height="16.0" rx="3" fill="#F7E4E1" stroke="#A9433A" stroke-width="1.6"/><text x="745.6" y="611.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566272" text-anchor="start" xml:space="preserve" style="white-space:pre">fallback / partial</text></svg>