# Development services. Same engines as production; no substitutes.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hsi
      POSTGRES_PASSWORD: hsi_dev_only
      POSTGRES_DB: hsi
    ports:
      - "5432:5432"
    volumes:
      - hsi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsi -d hsi"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hsi_pg:
