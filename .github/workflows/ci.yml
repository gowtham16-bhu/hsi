name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hsi
          POSTGRES_PASSWORD: hsi_dev_only
          POSTGRES_DB: hsi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hsi -d hsi" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HSI_PG_DSN: postgresql://hsi:hsi_dev_only@127.0.0.1:5432/hsi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/hsi-core -e packages/hsi-plugins-basic -e packages/hsi-plugins-faiss \
                      -e packages/hsi-plugins-postgres -e packages/hsi-harness \
                      -e packages/hsi-connector-kit -e packages/hsi-plugins-osv -e packages/hsi-service \
                      pytest ruff import-linter
      - name: Lint
        run: ruff check .
      - name: Core independence
        run: lint-imports
      - name: Tests
        run: pytest -m "not model"
