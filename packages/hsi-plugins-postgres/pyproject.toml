[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hsi-plugins-postgres"
version = "0.1.0"
description = "HSI metadata store plugin: PostgreSQL (passages, graph, shortcuts, run records)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["hsi-core", "psycopg[binary]>=3.2"]

[project.entry-points."hsi.plugins"]
"metadata_store:postgres" = "hsi_plugins_postgres:PostgresStore"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_plugins_postgres"]
