[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hsi-plugins-st"
version = "0.1.0"
description = "HSI encoder plugin: sentence-transformers models (default BAAI/bge-small-en-v1.5)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["hsi-core", "numpy>=1.26", "sentence-transformers>=3.0"]

[project.entry-points."hsi.plugins"]
"encoder:sentence-transformers" = "hsi_plugins_st:SentenceTransformerEncoder"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_plugins_st"]
