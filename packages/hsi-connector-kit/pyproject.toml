[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hsi-connector-kit"
version = "0.1.0"
description = "Conformance kit every HSI connector must pass before it can be enabled"
requires-python = ">=3.11"
dependencies = ["hsi-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_connector_kit"]
