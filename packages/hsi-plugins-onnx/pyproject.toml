[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hsi-plugins-onnx"
version = "0.1.0"
description = "HSI encoder plugin: ONNX Runtime on CPU for BERT-style embedding models (default bge-small-en-v1.5)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["hsi-core", "numpy>=1.26", "onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23"]

[project.entry-points."hsi.plugins"]
"encoder:onnx" = "hsi_plugins_onnx:OnnxEncoder"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_plugins_onnx"]
