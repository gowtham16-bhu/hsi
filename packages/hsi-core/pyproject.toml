[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hsi-core"
version = "0.1.0"
description = "Hierarchical Shortcut Index: core engine (domain-agnostic, no network or LLM dependencies)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_core"]
