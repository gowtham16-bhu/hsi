[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hsi-plugins-osv"
version = "0.1.0"
description = "HSI connector plugin: OSV advisories from a local dump (directory of OSV JSON files)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["hsi-core"]

[project.entry-points."hsi.plugins"]
"connector:osv" = "hsi_plugins_osv:OsvConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_plugins_osv"]
