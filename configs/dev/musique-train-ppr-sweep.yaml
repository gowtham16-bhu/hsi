# Development sweep (decision 0004): question-aware PPR on the MuSiQue TRAIN split. Tuning allowed here.
dataset: musique
data_file: data/musique/musique_ans_v1.0_train.jsonl
sample_size: 1000
seed: 0
encoder:
  plugin: onnx
  options:
    model: BAAI/bge-small-en-v1.5
    onnx_file: onnx/model.onnx
    max_seq_length: 512
    batch_size: 32
    query_instruction: "Represent this sentence for searching relevant passages: "   # from the model card
vector_store: { plugin: faiss, options: {} }
metadata_store: { plugin: postgres }      # reads HSI_PG_DSN
cache_dir: .cache/hsi
out_dir: runs/dev
graph:
  fan_out: 8
  hub_degree_cap: 50
  bidirectional: true
  co_mention: true
  weight_multi_token: 0.9
  weight_single_token: 0.6
  reverse_factor: 0.85
  co_mention_multi_token: 0.7
  co_mention_single_token: 0.45
  mention_extractor:
    plugin: capitalized
    options: { min_cap_ratio: 0.5, min_join_count: 2, min_join_share: 0.8, max_join_tokens: 2, max_words: 6, min_chars: 3, max_clitic_chars: 2 }
top_k_hits: 50
passage_budgets: [5, 10]
bootstrap: 1000
chains: { max_passages: 2, beam_level2: 3, beam_level3: 2, budget_ratio: null, key_mode: mean }
systems:
  - { name: dense, kind: dense }
  - { name: ppr-b0-a0.5-s5, kind: ppr, options: { seeds: 5, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b0-a0.5-s10, kind: ppr, options: { seeds: 10, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b0-a0.3-s5, kind: ppr, options: { seeds: 5, restart: 0.3, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b0-a0.3-s10, kind: ppr, options: { seeds: 10, restart: 0.3, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b2-a0.5-s5, kind: ppr, options: { seeds: 5, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 2.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b2-a0.5-s10, kind: ppr, options: { seeds: 10, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 2.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b2-a0.3-s5, kind: ppr, options: { seeds: 5, restart: 0.3, iterations: 50, tolerance: 1.0e-6, beta: 2.0, rank_by: total, keep_seeds: 0 } }
  - { name: ppr-b2-a0.3-s10, kind: ppr, options: { seeds: 10, restart: 0.3, iterations: 50, tolerance: 1.0e-6, beta: 2.0, rank_by: total, keep_seeds: 0 } }
