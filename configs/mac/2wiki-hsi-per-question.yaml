# Decision 0017 on an Apple Silicon Mac: configs/compare/2wiki-hsi-per-question.yaml with the
# sentence-transformers encoder on the Mac GPU (mps). Nothing else changes.
dataset: 2wiki
data_file: data/hipporag2/2wikimultihopqa.json
sample_size: null
seed: 0
encoder:
  plugin: st
  options:
    model: BAAI/bge-large-en-v1.5
    device: mps
    batch_size: 32
    max_seq_length: 512
    query_instruction: 'Represent this sentence for searching relevant passages: '
vector_store:
  plugin: faiss
  options: {}
metadata_store:
  plugin: postgres
cache_dir: .cache/hsi
out_dir: runs/compare-mac
graph:
  fan_out: 32
  hub_degree_cap: 200
  bidirectional: true
  co_mention: true
  weight_multi_token: 0.9
  weight_single_token: 0.6
  reverse_factor: 0.85
  co_mention_multi_token: 0.7
  co_mention_single_token: 0.45
  mention_extractor:
    plugin: capitalized
    options:
      min_cap_ratio: 0.5
      min_join_count: 2
      min_join_share: 0.8
      max_join_tokens: 2
      max_words: 6
      min_chars: 3
      max_clitic_chars: 2
top_k_hits: 50
passage_budgets:
- 5
- 10
bootstrap: 1000
chains:
  max_passages: 2
  beam_level2: 3
  beam_level3: 2
  budget_ratio: null
  key_mode: mean
passage_indexes: {}
systems:
- name: dense
  kind: dense
- name: system-A
  kind: ppr
  options:
    seeds: 3
    restart: 0.5
    iterations: 50
    tolerance: 1.0e-06
    beta: 0.0
    rank_by: total
    keep_seeds: 0
    transition_model: runs/models/transitions-musique-v2-fan32.json
decision: null
save_per_question: true
