# Demo index (A5): the HippoRAG 2 2Wiki corpus exported as JSONL, all public. Real encoder, no LLM.
index_id: demo-2wiki
out_dir: .indexes
sources:
  - { plugin: jsonl, options: { path: data/demo/2wiki-corpus.jsonl, source_name: wiki } }
chunking: { min_words: 48, max_words: 240, modulus: 64, window: 8 }
encoder:
  plugin: onnx
  options:
    model: BAAI/bge-small-en-v1.5
    onnx_file: onnx/model.onnx
    max_seq_length: 512
    batch_size: 32
    query_instruction: "Represent this sentence for searching relevant passages: "   # from the model card
cache_dir: .cache/hsi
vector_store: { plugin: faiss, options: {} }
metadata_store: { plugin: postgres }      # reads HSI_PG_DSN
graph:
  fan_out: 32
  hub_degree_cap: 200
  bidirectional: true
  co_mention: true
  weight_multi_token: 0.9
  weight_single_token: 0.6
  reverse_factor: 0.85
  co_mention_multi_token: 0.7
  co_mention_single_token: 0.45
  mention_extractor:
    plugin: capitalized
    options: { min_cap_ratio: 0.5, min_join_count: 2, min_join_share: 0.8, max_join_tokens: 2, max_words: 6, min_chars: 3, max_clitic_chars: 2 }
transition_model: runs/models/transitions-musique-v2-fan32.json
