# FINAL TEST (decision 0011, pre-registered): HippoRAG 2 musique set, run once.
dataset: musique
data_file: data/hipporag2/musique.json
sample_size: null
seed: 0
encoder:
  plugin: onnx
  options:
    model: BAAI/bge-large-en-v1.5
    onnx_file: onnx/model.onnx
    max_seq_length: 512
    batch_size: 8
    query_instruction: "Represent this sentence for searching relevant passages: "   # from the model card
vector_store: { plugin: faiss, options: {} }
metadata_store: { plugin: postgres }      # reads HSI_PG_DSN
cache_dir: .cache/hsi
out_dir: runs/test
graph:
  fan_out: 32
  hub_degree_cap: 200
  bidirectional: true
  co_mention: true
  weight_multi_token: 0.9
  weight_single_token: 0.6
  reverse_factor: 0.85
  co_mention_multi_token: 0.7
  co_mention_single_token: 0.45
  mention_extractor:
    plugin: capitalized
    options: { min_cap_ratio: 0.5, min_join_count: 2, min_join_share: 0.8, max_join_tokens: 2, max_words: 6, min_chars: 3, max_clitic_chars: 2 }
top_k_hits: 50
passage_budgets: [5, 10]
bootstrap: 1000
chains: { max_passages: 2, beam_level2: 3, beam_level3: 2, budget_ratio: null, key_mode: mean }
passage_indexes:
  sm-g0.2-s1: { gamma: 0.2, steps: 1 }
systems:
  - { name: dense, kind: dense }
  - { name: rule-walk, kind: ppr, options: { seeds: 5, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 2.0, rank_by: total, keep_seeds: 0 } }
  - { name: system-A, kind: ppr, options: { seeds: 3, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0, transition_model: runs/models/transitions-musique-v2-fan32.json } }
  - { name: system-B, kind: ppr, index: sm-g0.2-s1, options: { seeds: 5, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0, transition_model: runs/models/transitions-musique-v2-fan32.json } }
  - { name: dense-smoothed, kind: dense, index: sm-g0.2-s1 }
decision:
  name: final-test-0011
  all_of:
    - { candidate: system-A, baseline: dense, slice: all, k: 5, min_difference: 0.03, ci_low_above: 0.0, metric: passage_recall }
