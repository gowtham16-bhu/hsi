# Hub facets (decision 0014, pre-registered), facet size 50. Same questions and corpora as scale.yaml. MuSiQue TRAIN questions unseen by development and training;
# distractors are real passages from MuSiQue train and 2Wiki dev. Cost is the point; recall shows how
# quality holds as distractors grow.
questions: { dataset: musique, data_file: data/musique/musique_ans_v1.0_train.jsonl }
question_count: 200
seed: 7
exclude_samples:
  - { seed: 0, size: 1000 }      # development sample
  - { seed: 1, size: 2000 }      # transition training sample (drawn excluding the development sample)
pool:
  - { dataset: musique, data_file: data/musique/musique_ans_v1.0_train.jsonl }
  - { dataset: 2wiki, data_file: data/2wiki/dev.json }
sizes: [10000, 40000, 140000]
encoder:
  plugin: onnx
  options:
    model: BAAI/bge-small-en-v1.5
    onnx_file: onnx/model.onnx
    max_seq_length: 512
    batch_size: 32
    query_instruction: "Represent this sentence for searching relevant passages: "   # from the model card
vector_store: { plugin: faiss, options: {} }
cache_dir: .cache/hsi
out_dir: runs/bench
graph:
  fan_out: 32
  hub_degree_cap: 200
  bidirectional: true
  co_mention: true
  weight_multi_token: 0.9
  weight_single_token: 0.6
  reverse_factor: 0.85
  co_mention_multi_token: 0.7
  co_mention_single_token: 0.45
  hub_mode: facets
  facet_size: 50
  facet_iterations: 20
  mention_extractor:
    plugin: capitalized
    options: { min_cap_ratio: 0.5, min_join_count: 2, min_join_share: 0.8, max_join_tokens: 2, max_words: 6, min_chars: 3, max_clitic_chars: 2 }
transition_model: runs/models/transitions-musique-v2-fan32.json
ppr: { seeds: 3, restart: 0.5, iterations: 50, tolerance: 1.0e-6, beta: 0.0, rank_by: total, keep_seeds: 0 }
push: { seeds: 3, restart: 0.5, epsilon: 1.0e-4, beta: 0.0, max_pushes: 100000 }
global_ppr_max_size: 40000
k: 5
