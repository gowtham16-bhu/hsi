# Decision 0016: learned transitions trained at scale: 140K passages, m = 128, facets 50.
dataset: musique
data_file: data/musique/musique_ans_v1.0_train.jsonl
sample_size: 2000
seed: 1
exclude_sample: { seed: 0, size: 1000 }       # the development sample
encoder:
  plugin: onnx
  options:
    model: BAAI/bge-small-en-v1.5
    onnx_file: onnx/model.onnx
    max_seq_length: 512
    batch_size: 32
    query_instruction: "Represent this sentence for searching relevant passages: "   # from the model card
vector_store: { plugin: faiss, options: {} }
cache_dir: .cache/hsi
graph:
  fan_out: 128
  hub_degree_cap: 200
  bidirectional: true
  co_mention: true
  weight_multi_token: 0.9
  weight_single_token: 0.6
  reverse_factor: 0.85
  co_mention_multi_token: 0.7
  co_mention_single_token: 0.45
  hub_mode: facets
  facet_size: 50
  facet_iterations: 20
  mention_extractor:
    plugin: capitalized
    options: { min_cap_ratio: 0.5, min_join_count: 2, min_join_share: 0.8, max_join_tokens: 2, max_words: 6, min_chars: 3, max_clitic_chars: 2 }
training: { l2: 0.01, lr: 0.05, epochs: 300, seed: 0, validation_fraction: 0.2, baseline_beta: 2.0 }
output: runs/models/transitions-musique-v5-140k-fan128.json
distractors:
  - { dataset: musique, data_file: data/musique/musique_ans_v1.0_train.jsonl }
  - { dataset: 2wiki, data_file: data/2wiki/dev.json }
corpus_size: 140000
