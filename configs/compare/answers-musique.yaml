# Decision 0017 E3 (pre-registered): answer quality of a local reader from dense vs HSI top-5 passages.
per_question_file: runs/compare/musique-408756fe336b61c0-per-question.json
data_file: data/hipporag2/musique.json
id_field: id
aliases_field: answer_aliases
systems: [dense, system-A]        # baseline first, candidate last
question_count: 200
k: 5
system_prompt: "You answer questions using only the given passages. Reply with the answer only, in a few words."
user_template: "Passages:\n{passages}\n\nQuestion: {question}\nAnswer:"
passage_template: "{title}: {text}"
reader:
  model: Qwen/Qwen2.5-1.5B-Instruct
  max_new_tokens: 24
  threads: 4
normalization:                    # SQuAD v1.1 official answer normalization
  lowercase: true
  strip_punctuation: true
  remove_words: [a, an, the]
bootstrap: 1000
seed: 0
out_dir: runs/compare
